name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'feature/**'
      - 'test/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

# The actual build/vet/unit and integration jobs live in reusable-ci.yml so that
# CI and Release run exactly the same checks.
jobs:
  test:
    name: Verify
    uses: ./.github/workflows/reusable-ci.yml
