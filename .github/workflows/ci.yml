name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'feature/**'
      - 'test/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint, build and unit tests (no database required).
  # ---------------------------------------------------------------------------
  unit:
    name: Build, vet & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tail -n 20

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Integration tests against a real PostgreSQL server and SSH tunnel.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGTRANSFER_TEST_DSN: postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable
      # Fail (rather than skip) when the DB or tools are unavailable, so CI
      # cannot report success while running no integration tests.
      PGTRANSFER_TEST_REQUIRE: "1"
      # SSH tunnel test settings. The SSH server runs on the host and forwards
      # to the Postgres service, which it reaches via host.docker.internal
      # (mapped below); the test itself connects to the tunnel on localhost.
      PGTRANSFER_TEST_SSH_HOST: localhost
      PGTRANSFER_TEST_SSH_PORT: "2222"
      PGTRANSFER_TEST_SSH_USER: sshuser
      PGTRANSFER_TEST_SSH_PASSWORD: sshpass
      PGTRANSFER_TEST_DB_HOST: host.docker.internal
      PGTRANSFER_TEST_DB_PORT: "5432"
      PGTRANSFER_TEST_DB_USER: testuser
      PGTRANSFER_TEST_DB_PASSWORD: testpass
      PGTRANSFER_TEST_DB_NAME: testdb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # Install a PostgreSQL client newer than the server (17 vs 15) so the
      # version-skew tolerance path is exercised by the integration tests.
      - name: Install PostgreSQL client tools
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U testuser; then exit 0; fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      # Run the repository's SSH test image on the host, forwarding to the
      # mapped Postgres port. host.docker.internal lets the container reach the
      # runner's published 5432, matching the DB host used by the tunnel test.
      - name: Start SSH tunnel server
        run: |
          docker build -t pgtransfer-test-ssh ./scripts/ssh
          docker run -d --name pgtransfer-ssh \
            --add-host=host.docker.internal:host-gateway \
            -p 2222:22 \
            pgtransfer-test-ssh

      - name: Wait for SSH server
        run: |
          for i in $(seq 1 30); do
            if nc -z localhost 2222; then exit 0; fi
            sleep 2
          done
          echo "SSH server did not become ready in time" >&2
          docker logs pgtransfer-ssh || true
          exit 1

      - name: Run integration tests
        run: go test -tags=integration -v ./internal/io/...

      - name: SSH server logs (on failure)
        if: failure()
        run: docker logs pgtransfer-ssh || true
