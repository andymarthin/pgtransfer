name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write  # Required for creating releases

jobs:
  # ---------------------------------------------------------------------------
  # 1. Gate the release on the full test suite. No binaries are built unless
  #    every unit and integration test passes. Uses the same reusable pipeline
  #    as CI so a release can only be cut from code that would pass a PR.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    uses: ./.github/workflows/reusable-ci.yml

  # ---------------------------------------------------------------------------
  # 2. Cross-compile release binaries. Only reached once `verify` succeeds.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.suffix }}
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p build
          BINARY_NAME="pgtransfer"

          # Get build information
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_HASH=$(git rev-parse --short HEAD)

          go build -ldflags="-s -w -X github.com/andymarthin/pgtransfer/cmd.Version=${VERSION} -X github.com/andymarthin/pgtransfer/cmd.Commit=${COMMIT_HASH} -X github.com/andymarthin/pgtransfer/cmd.Date=${BUILD_DATE}" \
            -o build/${BINARY_NAME} .

      # Smoke-test the artifact: the binary must run and report the tag version.
      - name: Smoke test binary (version)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          out="$(./build/pgtransfer version)"
          echo "$out"
          echo "$out" | grep -qF "$VERSION" \
            || { echo "binary did not report version $VERSION" >&2; exit 1; }

      - name: Package archive
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd build
          tar -czf "pgtransfer-${VERSION}-${{ matrix.suffix }}.tar.gz" pgtransfer

      - name: Checksums
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd build
          shasum -a 256 "pgtransfer-${VERSION}-${{ matrix.suffix }}.tar.gz" \
            > "pgtransfer-${VERSION}-${{ matrix.suffix }}.tar.gz.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pgtransfer-${{ matrix.suffix }}
          path: build/pgtransfer-${{ steps.version.outputs.VERSION }}-${{ matrix.suffix }}.tar.gz*

  # ---------------------------------------------------------------------------
  # 3. Publish the GitHub release with all binaries and checksums attached.
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history and tags: the release body falls back to `git log` and
          # `git describe --tags` since the previous tag, which a shallow clone
          # cannot answer.
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Combined SHA256SUMS for easy verification of every download.
      - name: Combine checksums
        run: |
          find artifacts -name '*.sha256' -exec cat {} \; | sort -k2 > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - name: Generate release body
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Prefer the CHANGELOG.md section for the tag being released; otherwise
          # fall back to a body generated from git log.
          #
          # The section starts at the first "## " heading whose title names the
          # version (e.g. "## v1.4.0" or "## [1.4.0] - 2026-01-01") and ends at the
          # next "## " heading that also names a version, so the file's preamble,
          # the older releases in it, and any "## Features"-style headings
          # *inside* an entry are all handled: only the older releases are
          # dropped, and internal headings stay part of the section.
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              # A heading names a version when its title is, or starts with, a
              # number: "1.4.0", "[1.4.0] - date", "v1.4.0 (unreleased)".
              function title_version(line,   t) {
                t = line
                sub(/^##[[:space:]]+/, "", t)
                sub(/^\[/, "", t)
                if (t !~ /^v?[0-9]/) return ""
                sub(/\].*$/, "", t)
                sub(/[^0-9A-Za-z.].*$/, "", t)
                sub(/^v/, "", t)
                return t
              }
              {
                ishead = ($0 ~ /^##[[:space:]]/)
                hver = ishead ? title_version($0) : ""

                # A later version heading closes the section; an internal heading
                # (no version in it) does not.
                if (ishead && skip && hver != "") skip = 0

                if (ishead && !found && hver != "") {
                  want = ver
                  sub(/^v/, "", want)
                  if (hver == want) { found = 1; skip = 1; next }
                }

                # Drop a hand-written Downloads section: the workflow appends a
                # canonical one below (built from the version), so keeping both
                # would duplicate the section in the published release.
                if (ishead && $0 ~ /[Dd]ownloads/) { dl = 1; next }
                if (ishead && dl) dl = 0

                if (found && skip && !dl) print
              }
              END { if (!found) exit 3 }
            ' CHANGELOG.md > release-body.md \
              || { echo "CHANGELOG.md has no section for ${VERSION}; generating one from git log." >&2; rm -f release-body.md; }
          else
            echo "No CHANGELOG.md; generating the release body from git log."
          fi

          # The CHANGELOG.md branch bails out (or there is no CHANGELOG.md at
          # all); generate a body from git log so the release is never published
          # without one.
          if [ ! -s release-body.md ]; then
            echo "::warning::No usable CHANGELOG.md section for the tag; generated the release body from git log."
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "## What's Changed" > release-body.md
              echo "" >> release-body.md
              git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD >> release-body.md
            else
              echo "## Initial Release" > release-body.md
              echo "" >> release-body.md
              echo "First release of PGTransfer - PostgreSQL data transfer tool with SSH tunnel support." >> release-body.md
            fi
          fi

          # Drop trailing blank lines so the appended section is spaced cleanly.
          printf '%s\n' "$(cat release-body.md)" > release-body.md

          echo "" >> release-body.md
          echo "## Downloads" >> release-body.md
          echo "" >> release-body.md
          echo "Choose the appropriate binary for your platform:" >> release-body.md
          echo "" >> release-body.md
          echo "- **Linux (x64)**: \`pgtransfer-${VERSION}-linux-amd64.tar.gz\`" >> release-body.md
          echo "- **Linux (ARM64)**: \`pgtransfer-${VERSION}-linux-arm64.tar.gz\`" >> release-body.md
          echo "- **macOS (Intel)**: \`pgtransfer-${VERSION}-darwin-amd64.tar.gz\`" >> release-body.md
          echo "- **macOS (Apple Silicon)**: \`pgtransfer-${VERSION}-darwin-arm64.tar.gz\`" >> release-body.md
          echo "- **Installer**: \`install.sh\`" >> release-body.md
          echo "- **Checksums**: \`SHA256SUMS\`" >> release-body.md
          echo "" >> release-body.md
          echo "Verify downloads against the attached \`SHA256SUMS\`." >> release-body.md

          echo "----- release body -----"
          cat release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # Action inputs are not shell text, so the expression is safe here.
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body_path: release-body.md
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.tar.gz
            artifacts/SHA256SUMS
            scripts/install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 4. Ask the Homebrew tap to pick up the new version.
      #
      #    The release above is published (draft: false), so the archives and
      #    SHA256SUMS are publicly downloadable by the time this runs and the
      #    tap can verify the checksums immediately.
      #
      #    Best-effort: skipped when the token is not configured, and the tap
      #    also polls daily, so a missed dispatch self-heals within a day.
      # -----------------------------------------------------------------------
      - name: Notify Homebrew tap
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping tap dispatch."
            echo "The tap's scheduled run will pick up ${VERSION} within a day."
            exit 0
          fi

          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/andymarthin/homebrew-pgtransfer/dispatches" \
            -d "{\"event_type\":\"pgtransfer-release\",\"client_payload\":{\"version\":\"${VERSION}\"}}"

          echo "Dispatched pgtransfer-release for ${VERSION} to the Homebrew tap."
