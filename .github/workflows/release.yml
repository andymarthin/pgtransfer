name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write  # Required for creating releases

jobs:
  # ---------------------------------------------------------------------------
  # 1. Gate the release on the full test suite. No binaries are built unless
  #    every unit and integration test passes. Uses the same reusable pipeline
  #    as CI so a release can only be cut from code that would pass a PR.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    uses: ./.github/workflows/reusable-ci.yml

  # ---------------------------------------------------------------------------
  # 2. Cross-compile release binaries. Only reached once `verify` succeeds.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.suffix }}
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build
          BINARY_NAME="pgtransfer"

          # Get build information
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_HASH=$(git rev-parse --short HEAD)

          go build -ldflags="-s -w -X github.com/andymarthin/pgtransfer/cmd.Version=${{ steps.version.outputs.VERSION }} -X github.com/andymarthin/pgtransfer/cmd.Commit=${COMMIT_HASH} -X github.com/andymarthin/pgtransfer/cmd.Date=${BUILD_DATE}" \
            -o build/${BINARY_NAME} .

      # Smoke-test the artifact: the binary must run and report the tag version.
      - name: Smoke test binary (version)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          out="$(./build/pgtransfer version)"
          echo "$out"
          echo "$out" | grep -q "${{ steps.version.outputs.VERSION }}" \
            || { echo "binary did not report version ${{ steps.version.outputs.VERSION }}" >&2; exit 1; }

      - name: Package archive
        run: |
          cd build
          tar -czf pgtransfer-${{ steps.version.outputs.VERSION }}-${{ matrix.suffix }}.tar.gz pgtransfer

      - name: Checksums
        run: |
          cd build
          shasum -a 256 pgtransfer-${{ steps.version.outputs.VERSION }}-${{ matrix.suffix }}.tar.gz \
            > pgtransfer-${{ steps.version.outputs.VERSION }}-${{ matrix.suffix }}.tar.gz.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pgtransfer-${{ matrix.suffix }}
          path: build/pgtransfer-${{ steps.version.outputs.VERSION }}-${{ matrix.suffix }}.tar.gz*

  # ---------------------------------------------------------------------------
  # 3. Publish the GitHub release with all binaries and checksums attached.
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Combined SHA256SUMS for easy verification of every download.
      - name: Combine checksums
        run: |
          find artifacts -name '*.sha256' -exec cat {} \; | sort -k2 > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - name: Generate release body
        run: |
          # Prefer a hand-written RELEASE_NOTES.md when present; otherwise fall
          # back to an auto-generated changelog.
          if [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md release-body.md
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "## What's Changed" > release-body.md
              echo "" >> release-body.md
              git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD >> release-body.md
            else
              echo "## Initial Release" > release-body.md
              echo "" >> release-body.md
              echo "First release of PGTransfer - PostgreSQL data transfer tool with SSH tunnel support." >> release-body.md
            fi
          fi

          echo "" >> release-body.md
          echo "## Downloads" >> release-body.md
          echo "" >> release-body.md
          echo "Choose the appropriate binary for your platform:" >> release-body.md
          echo "" >> release-body.md
          echo "- **Linux (x64)**: \`pgtransfer-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz\`" >> release-body.md
          echo "- **Linux (ARM64)**: \`pgtransfer-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz\`" >> release-body.md
          echo "- **macOS (Intel)**: \`pgtransfer-${{ steps.version.outputs.VERSION }}-darwin-amd64.tar.gz\`" >> release-body.md
          echo "- **macOS (Apple Silicon)**: \`pgtransfer-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz\`" >> release-body.md
          echo "" >> release-body.md
          echo "Verify downloads against the attached \`SHA256SUMS\`." >> release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body_path: release-body.md
          draft: true
          prerelease: false
          files: |
            artifacts/**/*.tar.gz
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
